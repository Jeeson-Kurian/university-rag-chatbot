name: Deploy public demo to Hugging Face
# One-time setup: add the secret HF_TOKEN (a Hugging Face *write* token) and the
# repository variable HF_SPACE, e.g. "your-hf-name/course-compass". OPENAI_API_KEY is
# copied into the Space as a secret. Runs by hand, or on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "huggingface_hub>=0.25"
      - name: Publish Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '2' }}
        run: python deploy/huggingface/publish_space.py
