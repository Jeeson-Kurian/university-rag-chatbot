name: University Course Assistant CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Offline deterministic API and retrieval tests
        run: python -m pytest Code/tests/test_course_core.py -q
        env:
          OPENAI_API_KEY: ""
      - name: Compile and validate UI/API source
        run: python -m compileall -q Code streamlit_app.py
      - name: Docker build (no registry credentials needed)
        run: docker build -t course-assistant:test .
