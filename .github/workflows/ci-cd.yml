name: Course Compass CI
on:
  push:
    branches: [main, "course-compass-*"]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (engine, API, Streamlit app, evaluator)
        run: python -m pytest Code/tests -q
        env:
          OPENAI_API_KEY: ""
      - name: Offline evaluation with regression floors (development + held-out)
        run: python scripts/evaluate.py
        env:
          OPENAI_API_KEY: ""
      - name: Docker build, API image
        run: docker build -t course-compass-api:test .
      - name: Docker build, Hugging Face Space image
        run: docker build -f deploy/huggingface/Dockerfile -t course-compass-space:test .
