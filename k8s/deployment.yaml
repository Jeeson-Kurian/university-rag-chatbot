apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-rag-chatbot
  namespace: university-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-rag-chatbot
  template:
    metadata:
      labels:
        app: university-rag-chatbot
    spec:
      containers:
        - name: university-rag-chatbot
          image: jeesonku/university-rag-chatbot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY