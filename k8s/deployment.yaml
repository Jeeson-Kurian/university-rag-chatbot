apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-rag-chatbot
  namespace: university-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-rag-chatbot
  template:
    metadata:
      labels:
        app: university-rag-chatbot
    spec:
      containers:
        - name: chatbot
          image: university-rag-chatbot:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY